<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Документы">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Документы на подпись</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f2f2f7;--card:#fff;--text:#111;--muted:#6e6e73;--line:#e5e5ea;
      --blue:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--purple:#5856d6;
      --shadow:0 8px 30px rgba(0,0,0,.06)
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#000;--card:#1c1c1e;--text:#fff;--muted:#98989d;--line:#38383a;
        --blue:#0a84ff;--red:#ff453a;--orange:#ff9f0a;--green:#30d158;--purple:#5e5ce6;--shadow:none
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}.screen{display:none}.screen.active{display:block}
    .topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:30px;line-height:1.1;margin:0;font-weight:750}.sub{color:var(--muted);font-size:13px;margin-top:4px}
    .content{padding:16px;max-width:800px;margin:0 auto}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .stat,.form-card,.settings-card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .stat .n{font-size:26px;font-weight:750}.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
    .search{width:100%;border:0;background:var(--card);color:var(--text);border-radius:14px;padding:13px 14px;outline:none;box-shadow:var(--shadow)}
    .filters{display:flex;gap:8px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}
    .chip{border:0;border-radius:999px;background:var(--card);color:var(--text);padding:9px 13px;white-space:nowrap}.chip.active{background:var(--blue);color:#fff}
    .doc-card{background:var(--card);border-radius:18px;padding:15px;margin:12px 0;box-shadow:var(--shadow);border-left:4px solid transparent}
    .doc-card.overdue{border-left-color:var(--red)}.doc-card.urgent{border-left-color:var(--orange)}.doc-card.done{border-left-color:var(--green)}
    .doc-head{display:flex;justify-content:space-between;gap:12px}.company{font-weight:750;font-size:17px}.doctype{font-size:12px;font-weight:700;color:var(--blue);margin-top:3px;text-transform:uppercase}
    .deadline{font-size:13px;font-weight:700;text-align:right}.deadline.red{color:var(--red)}.deadline.orange{color:var(--orange)}.deadline.green{color:var(--green)}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta .item{background:var(--bg);border-radius:12px;padding:10px}.meta .k{font-size:11px;color:var(--muted)}.meta .v{font-size:14px;margin-top:2px;word-break:break-word}
    .comment{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;white-space:pre-wrap}
    .storage{margin-top:10px;padding:11px 12px;border-radius:12px;background:rgba(52,199,89,.10);font-size:14px}
    .storage .k{font-size:11px;color:var(--muted);margin-bottom:3px}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--text);font-weight:650}.btn.primary{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{color:var(--red)}.btn.wide{width:100%;padding:14px}
    .empty{text-align:center;color:var(--muted);padding:48px 20px}
    label{display:block;font-size:13px;color:var(--muted);margin:12px 2px 6px}
    input,select,textarea{width:100%;border:0;border-radius:12px;background:var(--bg);color:var(--text);padding:13px 12px;outline:none}textarea{min-height:90px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggles{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.toggle{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px}.toggle input{width:auto}
    .entity-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.entity-row:last-child{border-bottom:0}.small{font-size:12px;color:var(--muted)}
    .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr)}
    .navbtn{border:0;background:transparent;color:var(--muted);padding:6px 2px;font-size:11px}.navbtn span{display:block;font-size:21px;line-height:1.15;margin-bottom:2px}.navbtn.active{color:var(--blue);font-weight:700}
    .auth-wrap{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}.auth-card{width:min(100%,420px);background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.auth-title{text-align:center;font-size:26px;font-weight:800;margin-bottom:6px}.auth-sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.4;margin-bottom:18px}.auth-error{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
    .syncbar{font-size:12px;color:var(--muted);padding:8px 16px;text-align:center}.syncbar.ok{color:var(--green)}.syncbar.err{color:var(--red)}
    .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.48);display:none;align-items:flex-end}.modal.open{display:flex}
    .sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
    .sheet-title{font-size:22px;font-weight:800;margin-bottom:4px}.sheet-sub{color:var(--muted);font-size:13px;margin-bottom:8px}
    @media(max-width:560px){.meta,.row{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px 10px}.stat .n{font-size:22px}}
  </style>
</head>
<body>

<div id="authLayer" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Документы</div>
    <div class="auth-sub">Один аккаунт — общая база на iPhone и компьютере.</div>
    <label>Email</label><input id="authEmail" type="email" autocomplete="username" placeholder="name@example.com">
    <label>Пароль</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
    <button class="btn primary wide" style="margin-top:14px" onclick="signIn()">Войти</button>
    <button class="btn wide" style="margin-top:8px" onclick="signUp()">Создать аккаунт</button>
    <div id="authError" class="auth-error"></div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <div id="syncBar" class="syncbar">Синхронизация…</div>

  <section id="screen-docs" class="screen active">
    <div class="topbar">
      <div class="topline">
        <div><h1>Документы</h1><div class="sub" id="todayText"></div></div>
        <button class="btn primary" onclick="openAdd()">+ Добавить</button>
      </div>
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat"><div class="n" id="statPending">0</div><div class="l">На подпись</div></div>
        <div class="stat"><div class="n" id="statOverdue">0</div><div class="l">Просрочено</div></div>
        <div class="stat"><div class="n" id="statToday">0</div><div class="l">Сегодня</div></div>
      </div>
      <input id="search" class="search" placeholder="🔎 Поиск по документам" oninput="renderDocs()">
      <div class="filters">
        <button class="chip active" onclick="setFilter('all',this)">Все</button>
        <button class="chip" onclick="setFilter('urgent',this)">Срочные</button>
        <button class="chip" onclick="setFilter('overdue',this)">Просроченные</button>
      </div>
      <div id="docsList"></div>
    </div>
  </section>

  <section id="screen-archive" class="screen">
    <div class="topbar"><div class="topline"><div><h1>Архив</h1><div class="sub">История подписанных документов</div></div></div></div>
    <div class="content">
      <input id="archiveSearch" class="search" placeholder="🔎 Юрлицо, отправитель, тип, место хранения" oninput="renderArchive()">
      <div class="filters">
        <button class="chip active" onclick="setArchiveFilter('all',this)">Все</button>
        <button class="chip" onclick="setArchiveFilter('signed',this)">Подписанные</button>
        <button class="chip" onclick="setArchiveFilter('returned',this)">Возвращённые</button>
      </div>
      <div id="archiveList"></div>
    </div>
  </section>

  <section id="screen-companies" class="screen">
    <div class="topbar"><h1>Юрлица</h1></div>
    <div class="content">
      <div class="form-card">
        <label>Добавить юридическое лицо</label>
        <div class="row"><input id="newCompany" placeholder="ООО «Ветро»"><button class="btn primary" onclick="addCompany()">Добавить</button></div>
      </div>
      <div class="form-card" id="companiesList"></div>
    </div>
  </section>

  <section id="screen-settings" class="screen">
    <div class="topbar"><h1>Настройки</h1></div>
    <div class="content">
      <div class="settings-card">
        <b>Аккаунт</b><div class="small" id="accountEmail" style="margin-top:6px"></div>
        <button class="btn wide" style="margin-top:12px" onclick="signOut()">Выйти</button>
      </div>
      <div class="settings-card"><button class="btn wide" onclick="exportCSV()">Скачать весь журнал CSV</button></div>
      <div class="settings-card"><button class="btn wide" onclick="refreshAll()">Обновить данные</button></div>
    </div>
  </section>

  <nav class="bottomnav">
    <button class="navbtn active" data-screen="docs" onclick="showScreen('docs',this)"><span>📄</span>Документы</button>
    <button class="navbtn" data-screen="archive" onclick="showScreen('archive',this)"><span>🗄️</span>Архив</button>
    <button class="navbtn" data-screen="companies" onclick="showScreen('companies',this)"><span>🏢</span>Юрлица</button>
    <button class="navbtn" data-screen="settings" onclick="showScreen('settings',this)"><span>⚙️</span>Настройки</button>
  </nav>
</div>

<div id="docModal" class="modal" onclick="closeModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title" id="formTitle">Новый документ</div>
    <div class="sheet-sub">Карточка документа</div>
    <label>Юридическое лицо *</label><select id="company"></select>
    <label>От кого пришёл документ *</label><input id="sender" placeholder="ООО «Альфа» / Иванов И.И.">
    <div class="row">
      <div><label>Дата получения *</label><input id="receivedDate" type="date"></div>
      <div><label>Подписать до *</label><input id="dueDate" type="date"></div>
    </div>
    <div class="row">
      <div><label>Время до *</label><input id="dueTime" type="time"></div>
      <div>
        <label>Тип документа *</label>
        <select id="docType" onchange="toggleCustomType()">
          <option>УПД</option><option>Счёт</option><option>Доверенность</option><option>Договор</option><option>Письмо</option><option>Другое</option>
        </select>
      </div>
    </div>
    <div id="customTypeWrap" style="display:none"><label>Свой тип документа</label><input id="customType" placeholder="Например: акт, доп. соглашение"></div>
    <div class="toggles">
      <label class="toggle"><input id="needsSign" type="checkbox" checked> Нужна подпись</label>
      <label class="toggle"><input id="needsStamp" type="checkbox" checked> Нужна печать</label>
    </div>
    <label>Комментарий</label><textarea id="comment" placeholder="Что сделать, кому вернуть и т.п."></textarea>
    <button class="btn primary wide" style="margin-top:14px" onclick="saveDocument()">Сохранить</button>
    <button class="btn wide" style="margin-top:8px" onclick="closeModal()">Отмена</button>
  </div>
</div>

<div id="signModal" class="modal" onclick="closeSignModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title">Документ подписан</div>
    <div class="sheet-sub">Заполни данные для архива.</div>
    <div class="row">
      <div><label>Дата подписания *</label><input id="signedDate" type="date"></div>
      <div><label>Время подписания *</label><input id="signedTime" type="time"></div>
    </div>
    <label>Где хранится документ *</label>
    <input id="storageLocation" placeholder="Например: шкаф 2 / папка Договоры 2026 / Диадок">
    <label>Комментарий к архиву</label>
    <textarea id="archiveComment" placeholder="Например: оригинал у бухгалтерии, скан в сетевой папке"></textarea>
    <button class="btn green wide" style="margin-top:14px" onclick="confirmSigned()">Сохранить в архив</button>
    <button class="btn wide" style="margin-top:8px" onclick="closeSignModal()">Отмена</button>
  </div>
</div>

<script>
const SUPABASE_URL='https://jrnldpijenksjikeooiv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_nF1xSjPaTg7rB98ktFaCsw_aQg0xCuV';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let docs=[],companies=[],currentFilter='all',archiveFilter='all',editingId=null,signingId=null,user=null,realtimeChannel=null;

function localDateStr(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function localTimeStr(d=new Date()){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function parseLocal(s){return s?new Date(s+'T00:00:00'):null}
function daysDiff(a,b){return Math.round((parseLocal(a)-parseLocal(b))/86400000)}
function fmt(s){return s?parseLocal(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}
function fmtDateTime(s){if(!s)return '—';const d=new Date(s);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function esc(s=''){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function typeText(d){return d.docType==='Другое'?(d.customType||'Другое'):d.docType}
function showSync(text,kind=''){const e=document.getElementById('syncBar');e.textContent=text;e.className='syncbar '+kind}
function configOk(){return !SUPABASE_URL.includes('PASTE_')&&!SUPABASE_ANON_KEY.includes('PASTE_')}

async function signUp(){
  if(!configOk()){authError('Сначала вставьте Supabase URL и anon key в index.html.');return}
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;
  const {error}=await sb.auth.signUp({email,password});
  authError(error?error.message:'Аккаунт создан. Если Supabase попросит подтверждение email — подтвердите письмо, затем войдите.');
}
async function signIn(){
  if(!configOk()){authError('Сначала вставьте Supabase URL и anon key в index.html.');return}
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  authError(error?error.message:'');if(data?.user)await enterApp(data.user)
}
function authError(t){document.getElementById('authError').textContent=t}
async function signOut(){await sb.auth.signOut();location.reload()}
async function enterApp(u){
  user=u;document.getElementById('authLayer').classList.add('hidden');document.getElementById('appRoot').classList.remove('hidden');
  document.getElementById('accountEmail').textContent=u.email||'';await refreshAll();subscribeRealtime()
}
async function refreshAll(){
  if(!user)return;showSync('Синхронизация…');
  const [{data:d,error:de},{data:c,error:ce}]=await Promise.all([
    sb.from('documents').select('*').order('due_date',{ascending:true}),
    sb.from('companies').select('*').order('name',{ascending:true})
  ]);
  if(de||ce){showSync('Ошибка синхронизации','err');console.error(de||ce);return}
  docs=(d||[]).map(x=>({
    id:x.id,companyId:x.company_id,company:x.company_name,sender:x.sender,receivedDate:x.received_date,
    dueDate:x.due_date,dueTime:x.due_time||'',docType:x.doc_type,customType:x.custom_type||'',
    needsSign:x.needs_sign,needsStamp:x.needs_stamp,comment:x.comment||'',status:x.status,
    signedAt:x.signed_at||null,storageLocation:x.storage_location||'',archiveComment:x.archive_comment||'',
    returnedAt:x.returned_at||null,createdAt:x.created_at
  }));
  companies=(c||[]).map(x=>({id:x.id,name:x.name}));
  refreshCompanySelect();renderDocs();renderArchive();renderCompanies();showSync('Синхронизировано','ok')
}
function subscribeRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('docflow-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'documents'},()=>refreshAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'companies'},()=>refreshAll()).subscribe()
}

function showScreen(name,btn){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
  const n=btn||document.querySelector(`.navbtn[data-screen="${name}"]`);if(n)n.classList.add('active');
  if(name==='docs')renderDocs();if(name==='archive')renderArchive();if(name==='companies')renderCompanies();window.scrollTo(0,0)
}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('#screen-docs .chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderDocs()}
function setArchiveFilter(f,el){archiveFilter=f;document.querySelectorAll('#screen-archive .chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderArchive()}

function renderStats(){
  const t=localDateStr(),p=docs.filter(d=>d.status==='pending');
  document.getElementById('statPending').textContent=p.length;
  document.getElementById('statOverdue').textContent=p.filter(d=>d.dueDate<t).length;
  document.getElementById('statToday').textContent=p.filter(d=>d.dueDate===t).length
}
function deadlineInfo(d){
  const diff=daysDiff(d.dueDate,localDateStr());
  if(diff<0)return{cls:'red',card:'overdue',text:`Просрочено на ${Math.abs(diff)} дн.`};
  if(diff===0)return{cls:'orange',card:'urgent',text:`Сегодня${d.dueTime?' до '+d.dueTime:''}`};
  if(diff===1)return{cls:'orange',card:'urgent',text:`Завтра${d.dueTime?' до '+d.dueTime:''}`};
  if(diff<=3)return{cls:'orange',card:'urgent',text:`Осталось ${diff} дн.`};
  return{cls:'',card:'',text:`До ${fmt(d.dueDate)}${d.dueTime?' '+d.dueTime:''}`}
}
function renderDocs(){
  renderStats();
  const q=(document.getElementById('search').value||'').toLowerCase(),today=localDateStr();
  let list=docs.filter(d=>{
    if(d.status!=='pending')return false;
    const text=[d.company,d.sender,d.docType,d.customType,d.comment].join(' ').toLowerCase();if(q&&!text.includes(q))return false;
    const diff=daysDiff(d.dueDate,today);
    if(currentFilter==='overdue'&&diff>=0)return false;
    if(currentFilter==='urgent'&&!(diff>=0&&diff<=3))return false;
    return true
  });
  list.sort((a,b)=>(a.dueDate+a.dueTime).localeCompare(b.dueDate+b.dueTime));
  const box=document.getElementById('docsList');if(!list.length){box.innerHTML='<div class="empty">Документов на подпись нет</div>';return}
  box.innerHTML=list.map(d=>{const dl=deadlineInfo(d);return `<div class="doc-card ${dl.card}">
    <div class="doc-head"><div><div class="company">${esc(d.company)}</div><div class="doctype">${esc(typeText(d))}</div></div><div class="deadline ${dl.cls}">${esc(dl.text)}</div></div>
    <div class="meta">
      <div class="item"><div class="k">От кого</div><div class="v">${esc(d.sender)}</div></div>
      <div class="item"><div class="k">Получен</div><div class="v">${fmt(d.receivedDate)}</div></div>
      <div class="item"><div class="k">Подписать до</div><div class="v">${fmt(d.dueDate)}${d.dueTime?' • '+esc(d.dueTime):''}</div></div>
      <div class="item"><div class="k">Нужно</div><div class="v">${[d.needsSign?'подпись':'',d.needsStamp?'печать':''].filter(Boolean).join(' + ')||'—'}</div></div>
    </div>
    ${d.comment?`<div class="comment">${esc(d.comment)}</div>`:''}
    <div class="actions"><button class="btn" onclick="editDoc('${d.id}')">Изменить</button><button class="btn green" onclick="openSignModal('${d.id}')">✓ Подписан</button><button class="btn red" onclick="deleteDoc('${d.id}')">Удалить</button></div>
  </div>`}).join('')
}
function renderArchive(){
  const q=(document.getElementById('archiveSearch').value||'').toLowerCase();
  let list=docs.filter(d=>{
    if(!d.signedAt)return false;
    if(archiveFilter==='signed'&&d.status!=='signed')return false;
    if(archiveFilter==='returned'&&d.status!=='returned')return false;
    const text=[d.company,d.sender,d.docType,d.customType,d.storageLocation,d.archiveComment,d.comment].join(' ').toLowerCase();
    return !q||text.includes(q)
  });
  list.sort((a,b)=>new Date(b.signedAt)-new Date(a.signedAt));
  const box=document.getElementById('archiveList');if(!list.length){box.innerHTML='<div class="empty">Архив пока пуст</div>';return}
  box.innerHTML=list.map(d=>`<div class="doc-card done">
    <div class="doc-head"><div><div class="company">${esc(d.company)}</div><div class="doctype">${esc(typeText(d))}</div></div><div class="deadline green">${d.status==='returned'?'Возвращён':'Подписан'}</div></div>
    <div class="meta">
      <div class="item"><div class="k">От кого</div><div class="v">${esc(d.sender)}</div></div>
      <div class="item"><div class="k">Получен</div><div class="v">${fmt(d.receivedDate)}</div></div>
      <div class="item"><div class="k">Подписан</div><div class="v">${fmtDateTime(d.signedAt)}</div></div>
      <div class="item"><div class="k">Срок был</div><div class="v">${fmt(d.dueDate)}${d.dueTime?' • '+esc(d.dueTime):''}</div></div>
    </div>
    <div class="storage"><div class="k">Где хранится</div><div>${esc(d.storageLocation||'Не указано')}</div></div>
    ${d.archiveComment?`<div class="comment"><b>Архив:</b> ${esc(d.archiveComment)}</div>`:''}
    ${d.comment?`<div class="comment">${esc(d.comment)}</div>`:''}
    <div class="actions">
      <button class="btn" onclick="editArchive('${d.id}')">Изменить архив</button>
      ${d.status!=='returned'?`<button class="btn" onclick="markReturned('${d.id}')">Возвращён</button>`:''}
    </div>
  </div>`).join('')
}

function openAdd(){editingId=null;resetForm();document.getElementById('docModal').classList.add('open')}
function closeModal(e){if(e&&e.target!==document.getElementById('docModal'))return;document.getElementById('docModal').classList.remove('open')}
function resetForm(){
  editingId=null;document.getElementById('formTitle').textContent='Новый документ';refreshCompanySelect();
  document.getElementById('sender').value='';document.getElementById('receivedDate').value=localDateStr();document.getElementById('dueDate').value=localDateStr();document.getElementById('dueTime').value='18:00';
  document.getElementById('docType').value='УПД';document.getElementById('customType').value='';document.getElementById('customTypeWrap').style.display='none';
  document.getElementById('needsSign').checked=true;document.getElementById('needsStamp').checked=true;document.getElementById('comment').value=''
}
function refreshCompanySelect(selected=''){const s=document.getElementById('company');s.innerHTML=companies.length?companies.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join(''):'<option value="">Сначала добавьте юрлицо</option>'}
function toggleCustomType(){document.getElementById('customTypeWrap').style.display=document.getElementById('docType').value==='Другое'?'block':'none'}
async function saveDocument(){
  const companyId=document.getElementById('company').value,comp=companies.find(c=>c.id===companyId),sender=document.getElementById('sender').value.trim(),receivedDate=document.getElementById('receivedDate').value,dueDate=document.getElementById('dueDate').value,dueTime=document.getElementById('dueTime').value,docType=document.getElementById('docType').value,customType=document.getElementById('customType').value.trim();
  if(!comp){alert('Добавьте юридическое лицо.');return}if(!sender||!receivedDate||!dueDate||!dueTime){alert('Заполните обязательные поля.');return}if(docType==='Другое'&&!customType){alert('Введите свой тип документа.');return}
  const payload={user_id:user.id,company_id:comp.id,company_name:comp.name,sender,received_date:receivedDate,due_date:dueDate,due_time:dueTime,doc_type:docType,custom_type:customType,needs_sign:document.getElementById('needsSign').checked,needs_stamp:document.getElementById('needsStamp').checked,comment:document.getElementById('comment').value.trim()};
  const res=editingId?await sb.from('documents').update(payload).eq('id',editingId):await sb.from('documents').insert({...payload,status:'pending'});
  if(res.error){alert(res.error.message);return}closeModal();editingId=null;await refreshAll()
}
function editDoc(id){
  const d=docs.find(x=>x.id===id);if(!d)return;editingId=id;document.getElementById('formTitle').textContent='Редактирование';refreshCompanySelect(d.companyId);
  document.getElementById('sender').value=d.sender;document.getElementById('receivedDate').value=d.receivedDate;document.getElementById('dueDate').value=d.dueDate;document.getElementById('dueTime').value=d.dueTime||'18:00';document.getElementById('docType').value=d.docType;document.getElementById('customType').value=d.customType||'';document.getElementById('needsSign').checked=!!d.needsSign;document.getElementById('needsStamp').checked=!!d.needsStamp;document.getElementById('comment').value=d.comment||'';toggleCustomType();document.getElementById('docModal').classList.add('open')
}
async function deleteDoc(id){if(!confirm('Удалить документ?'))return;const {error}=await sb.from('documents').delete().eq('id',id);if(error)alert(error.message);else refreshAll()}

function openSignModal(id){
  signingId=id;const now=new Date();document.getElementById('signedDate').value=localDateStr(now);document.getElementById('signedTime').value=localTimeStr(now);document.getElementById('storageLocation').value='';document.getElementById('archiveComment').value='';document.getElementById('signModal').classList.add('open')
}
function closeSignModal(e){if(e&&e.target!==document.getElementById('signModal'))return;document.getElementById('signModal').classList.remove('open');signingId=null}
async function confirmSigned(){
  if(!signingId)return;const date=document.getElementById('signedDate').value,time=document.getElementById('signedTime').value,storage=document.getElementById('storageLocation').value.trim(),archiveComment=document.getElementById('archiveComment').value.trim();
  if(!date||!time||!storage){alert('Укажите дату, время подписания и место хранения.');return}
  const signedAt=new Date(`${date}T${time}:00`).toISOString();
  const {error}=await sb.from('documents').update({status:'signed',signed_at:signedAt,storage_location:storage,archive_comment:archiveComment,updated_at:new Date().toISOString()}).eq('id',signingId);
  if(error){alert(error.message);return}closeSignModal();await refreshAll();showScreen('archive')
}
async function editArchive(id){
  const d=docs.find(x=>x.id===id);if(!d)return;signingId=id;
  const dt=new Date(d.signedAt);document.getElementById('signedDate').value=localDateStr(dt);document.getElementById('signedTime').value=localTimeStr(dt);
  document.getElementById('storageLocation').value=d.storageLocation||'';document.getElementById('archiveComment').value=d.archiveComment||'';document.getElementById('signModal').classList.add('open')
}
async function markReturned(id){
  if(!confirm('Отметить документ как возвращённый? Он останется в архиве.'))return;
  const {error}=await sb.from('documents').update({status:'returned',returned_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);
  if(error)alert(error.message);else refreshAll()
}

async function addCompany(){const name=document.getElementById('newCompany').value.trim();if(!name)return;const {error}=await sb.from('companies').insert({user_id:user.id,name});if(error)alert(error.message);else{document.getElementById('newCompany').value='';refreshAll()}}
function renderCompanies(){const box=document.getElementById('companiesList');if(!companies.length){box.innerHTML='<div class="empty">Юрлица ещё не добавлены</div>';return}box.innerHTML=companies.map(c=>`<div class="entity-row"><div>${esc(c.name)}</div><button class="btn red" onclick="deleteCompany('${c.id}')">Удалить</button></div>`).join('')}
async function deleteCompany(id){if(docs.some(d=>d.companyId===id)){alert('Сначала удалите или измените связанные документы.');return}if(!confirm('Удалить юрлицо?'))return;const {error}=await sb.from('companies').delete().eq('id',id);if(error)alert(error.message);else refreshAll()}

function exportCSV(){
  const rows=[['Юрлицо','Тип','От кого','Получен','Подписать до','Время до','Подпись','Печать','Статус','Подписан когда','Где хранится','Архивный комментарий','Комментарий']];
  docs.forEach(d=>rows.push([d.company,typeText(d),d.sender,d.receivedDate,d.dueDate,d.dueTime||'',d.needsSign?'Да':'Нет',d.needsStamp?'Да':'Нет',d.status,d.signedAt?fmtDateTime(d.signedAt):'',d.storageLocation||'',d.archiveComment||'',d.comment||'']));
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='documents-journal.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}

document.getElementById('todayText').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
(async()=>{if(!configOk())return;const {data:{session}}=await sb.auth.getSession();if(session?.user)enterApp(session.user)})();
</script>
